# Pages CMS 配置 —— https://pagescms.org/docs/configuration/
# 后台地址：https://app.pagescms.org

media:
  input: static/images    # 图片实际存放位置（仓库内）
  output: /images         # 写进文章里的图片 URL 前缀

content:
  - name: posts
    label: 文章
    type: collection
    path: content/posts
    format: yaml-frontmatter    # 对应 Hugo 的 --- YAML front matter
    # 文件名模板。必须带非空前缀：中文标题 slug 化后是空串，
    # 若模板只有 "{title}.md" 会生成隐藏文件 ".md"，Pages CMS 报
    # Invalid extension "" 。日期前缀保证不会出现这种情况。
    # field: create -> 新建时显示文件名输入框，可手填英文 slug（更利于 SEO）
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    exclude:
      - _index.md
    view:
      fields: [title, date, draft, categories]
      primary: title
      sort: [date, title]
      search: [title, categories, tags]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: 标题
        type: string
        required: true
      - name: date
        label: 发布时间
        type: date
        required: true
      - name: draft
        label: 存为草稿（勾选后不会发布到线上）
        type: boolean
        default: false
      - name: categories
        label: 分类
        type: string
        list: true
      - name: tags
        label: 标签
        type: string
        list: true
      - name: body
        label: 正文
        type: rich-text
        options:
          format: markdown
