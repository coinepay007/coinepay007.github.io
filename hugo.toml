baseURL = 'https://coinepay007.github.io/'
languageCode = 'zh-cn'
defaultContentLanguage = 'zh'
title = 'coinepay007'
theme = 'PaperMod'

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']   # JSON 供站内搜索使用

[taxonomies]
  category = 'categories'
  tag = 'tags'

[params]
  env = 'production'
  title = 'coinepay007'
  description = '一张虚拟卡搞定 AI 服务订阅、海外会员开通与跨境消费，实时充值、即开即用'
  keywords = ['虚拟信用卡', 'ChatGPT订阅', '海外会员', '虚拟卡开通', 'Coinepay']
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'      # auto / light / dark
  disableThemeToggle = false

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false
  hideSummary = false
  comments = false

  [params.homeInfoParams]
    Title = 'Coinepay · 海外订阅与消费'
    Content = '''
想订 ChatGPT Plus、Claude，或者开个 YouTube Premium、Netflix，卡在支付这一步——这大概是最常见的情况。

国内的卡在这些平台上经常过不去，不是被拒就是反复验证。虚拟卡解决的就是这件事：

**能用来做什么**

订阅 ChatGPT、Claude、Midjourney 等 AI 服务；开通 YouTube、Netflix、Spotify 会员；注册美区 Apple ID 并绑卡；投放 Facebook、Google、TikTok 广告；海外网站购物与各类线上服务。

**怎么用**

注册后在线开卡，实时充值，卡号立即可用，不用等实体卡邮寄。支持多币种结算，按实际消费扣款。

开卡遇到问题随时找人工，**Telegram [@coinepayqi](https://t.me/coinepayqi)** · **[WhatsApp](https://wa.me/message/2I3GXEELDVMHP1)**
'''

  [[params.socialIcons]]
    name = 'telegram'
    url = 'https://t.me/coinepayqi'

  [[params.socialIcons]]
    name = 'whatsapp'
    url = 'https://wa.me/message/2I3GXEELDVMHP1'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/coinepay007'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50

[markup.highlight]
  noClasses = false
  codeFences = true
  guessSyntax = true
  lineNos = false
  style = 'monokai'
