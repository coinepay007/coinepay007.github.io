baseURL = 'https://coinepay007.github.io/'
theme = 'PaperMod'

# ── 多语言 ────────────────────────────────────
# 中文在站点根目录（/posts/...），其余语言在 /<语言代码>/ 下，原有中文链接不变。
# params.noindex = true 的语言暂不进 sitemap，页面带 noindex,follow；
# 该语言有了文章后，删掉它的 noindex 一行即可放出。
# params.langGroup：切换器下拉面板的分组。
defaultContentLanguage = 'zh'
defaultContentLanguageInSubdir = false

enableRobotsTXT = true
enableEmoji = true
buildDrafts = false
buildFuture = false
buildExpired = false

[pagination]
  pagerSize = 10

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ['HTML', 'RSS', 'JSON']

[taxonomies]
  category = 'categories'
  tag = 'tags'

# ── 全站通用参数（会被各语言的 params 覆盖/补充）──
[params]
  env = 'production'
  DateFormat = '2006-01-02'
  defaultTheme = 'auto'      # auto / light / dark
  disableThemeToggle = false

  ShowReadingTime = true
  ShowWordCount = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  hidemeta = false
  hideSummary = false
  comments = false


  [[params.socialIcons]]
    name = 'telegram'
    url = 'https://t.me/coinepayqi'

  [[params.socialIcons]]
    name = 'whatsapp'
    url = 'https://wa.me/message/2I3GXEELDVMHP1'

  [[params.socialIcons]]
    name = 'github'
    url = 'https://github.com/coinepay007'

  [[params.socialIcons]]
    name = 'rss'
    url = 'index.xml'

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ['title', 'permalink', 'summary', 'content']

[[menu.main]]
  identifier = 'posts'
  name = '文章'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'archives'
  name = '归档'
  url = '/archives/'
  weight = 20

[[menu.main]]
  identifier = 'categories'
  name = '分类'
  url = '/categories/'
  weight = 30

[[menu.main]]
  identifier = 'tags'
  name = '标签'
  url = '/tags/'
  weight = 40

[[menu.main]]
  identifier = 'search'
  name = '搜索'
  url = '/search/'
  weight = 50

